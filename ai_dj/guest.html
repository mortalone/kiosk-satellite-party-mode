<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Party · Find musik</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151e;color:#f0f3fa}body{margin:0 auto;max-width:760px;padding:30px 20px}header small{color:#83dfc7;text-transform:uppercase;letter-spacing:3px}h1{font-size:clamp(30px,7vw,46px);letter-spacing:-1.5px;margin:10px 0}p{color:#a8b6c8;line-height:1.5}button,input{font:inherit;color:inherit;background:#1c2838;border:1px solid #34465a;border-radius:14px;padding:13px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.active,.accent{background:#226252;border-color:#3d8b76}.tabs{display:flex;gap:8px;margin:28px 0 18px}.tabs button{flex:1}form{display:flex;gap:9px}input[type=search]{width:100%;min-width:0}#similar-current{width:100%;text-align:left;margin:14px 0}#results{margin:24px 0}.track{display:flex;align-items:center;gap:14px;padding:16px;background:#192332;border:1px solid #28384c;border-radius:17px;margin:10px 0}.track input{width:19px;height:19px;flex-shrink:0}.track strong{display:block}.track small{display:block;color:#a8b6c8;margin-top:4px}.bottom{position:sticky;bottom:12px;background:#10151eee;border:1px solid #34465a;border-radius:18px;padding:12px;backdrop-filter:blur(8px)}.bottom button{width:100%}#status{min-height:24px}footer{font-size:13px;margin-top:32px;color:#8295ac}@media(max-width:420px){body{padding:22px 14px}form{flex-direction:column}}
</style></head>
<body><header><small>Party · Jukebox</small><h1>Hvad vil du høre?</h1><p>Find et nummer, og tilføj det til festen.</p></header>
<nav class="tabs" aria-label="Søgemåde"><button data-mode="library">Søg</button><button data-mode="similar">Similar</button><button data-mode="ai">AI DJ</button></nav>
<p id="help"></p><form><input id="query" type="search" maxlength="1000" autocomplete="off" aria-label="Musikønske"><button id="search" class="accent">Find musik</button></form>
<button id="similar-current" hidden>≈ Lignende det aktuelle nummer</button>
<p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="Søgeresultater"></section>
<div id="add-bar" class="bottom" hidden><button id="add" class="accent">Tilføj valgte numre til køen</button></div>
<footer>Numrene tilføjes sidst i den eksisterende Music Assistant-kø. Musikken, der spiller, fortsætter.</footer>
<script>
const $=id=>document.getElementById(id), tabs=[...document.querySelectorAll('[data-mode]')];
let token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('party-guest-token')||'';
if(token){sessionStorage.setItem('party-guest-token',token);history.replaceState(null,'',location.pathname);}
let modes={},mode='library',job=null,epoch=0,busy=false,configBusy=false,disposed=false;
async function api(path,data){const r=await fetch('/api/guest/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'Forbindelsen mislykkedes');return v;}
function changeMode(value){mode=value;epoch++;busy=false;$('search').disabled=false;job=null;$('results').replaceChildren();$('add-bar').hidden=true;$('status').textContent='';tabs.forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));$('help').textContent=mode==='ai'?'Beskriv stemningen, stilen eller det, du skal lave. AI-forslag matches med dine musikkilder.':mode==='similar'?'Beskriv en lyd for Sonic Similarity, eller find musik, der ligner det aktuelle nummer.':'Søg efter titel eller kunstner i festens musikkilder.';$('query').placeholder=mode==='ai'?'Fx rolig jazz med saxofon':mode==='similar'?'Fx calm jazz with saxophone':'Titel eller kunstner';}
async function refresh(){if(configBusy||disposed)return;configBusy=true;try{const c=await api('config');if(disposed)return;modes=c.modes;tabs.forEach(t=>t.hidden=!modes[t.dataset.mode]);if(!modes[mode])changeMode(tabs.find(t=>!t.hidden)?.dataset.mode||'library');const enabled=tabs.some(t=>!t.hidden);document.querySelector('form').hidden=!enabled;$('help').hidden=!enabled;if(!enabled)$('status').textContent='Musiksøgning er slået fra af værten.';$('similar-current').hidden=!(modes.current_similar&&c.current.uri);$('similar-current').textContent='≈ Lignende '+(c.current.name||'det aktuelle nummer');}catch(e){$('status').textContent=e.message;}finally{configBusy=false;}}
function render(v){job=v;$('results').replaceChildren();for(const [i,t] of v.tracks.entries()){const row=document.createElement('label');row.className='track';const check=document.createElement('input');check.type='checkbox';check.value=i;check.checked=!v.added.includes(i);check.disabled=v.added.includes(i);const text=document.createElement('div'),title=document.createElement('strong'),artist=document.createElement('small');title.textContent=t.name;artist.textContent=(t.artists||[]).map(a=>a.name).join(', ')+(check.disabled?' · Tilføjet':'');text.append(title,artist);row.append(check,text);$('results').append(row);}$('add-bar').hidden=!v.tracks.some((_,i)=>!v.added.includes(i));$('status').textContent=v.tracks.length?'Vælg de numre, du vil tilføje.':'Ingen numre fundet. Prøv et andet ønske.';}
async function search(selected){if(busy)return;const query=$('query').value.trim();if(selected!=='current_similar'&&!query)return;const run=++epoch;busy=true;$('search').disabled=true;$('results').replaceChildren();$('add-bar').hidden=true;$('status').textContent=selected==='ai'?'AI finder musik…':'Søger…';try{const created=await api('search',{mode:selected,query});const started=Date.now();for(;;){if(run!==epoch||disposed)return;const v=await api('jobs/'+created.id);if(run!==epoch||disposed)return;if(v.state==='error')throw Error(v.error);if(v.state==='ready'){render(v);break;}if(Date.now()-started>180000)throw Error('Søgningen tog for lang tid. Prøv igen.');$('status').textContent=v.progress||'Finder forslag…';await new Promise(r=>setTimeout(r,1200));}}catch(e){if(run===epoch)$('status').textContent=e.message;}finally{if(run===epoch){busy=false;$('search').disabled=false;}}}
tabs.forEach(t=>t.onclick=()=>changeMode(t.dataset.mode));document.querySelector('form').onsubmit=e=>{e.preventDefault();search(mode);};$('similar-current').onclick=()=>search('current_similar');
$('add').onclick=async()=>{if(!job)return;const activeJob=job,run=epoch;const selected=[...$('results').querySelectorAll('input:checked:not(:disabled)')].map(i=>Number(i.value));if(!selected.length)return;$('add').disabled=true;try{const result=await api('queue',{id:activeJob.id,indices:selected});const updated=await api('jobs/'+activeJob.id);if(run===epoch){render(updated);$('status').textContent=result.queued+' numre tilføjet til køen';}}catch(e){if(run===epoch)$('status').textContent=e.message;}finally{$('add').disabled=false;}};
changeMode('library');refresh();const timer=setInterval(refresh,15000);addEventListener('pagehide',()=>{disposed=true;epoch++;clearInterval(timer);});
</script></body></html>
