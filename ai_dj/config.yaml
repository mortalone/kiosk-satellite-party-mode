name: Party AI DJ
version: "0.1.0"
slug: party_ai_dj
description: AI playlists with verified Music Assistant catalog matches and queue preview
url: https://github.com/mortalone/kiosk-satellite-party-mode/tree/main/ai_dj
arch: [amd64, aarch64]
startup: application
boot: manual
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:headphones
ports:
  8101/tcp: null
ports_description:
  8101/tcp: Authenticated DJ page/API for Kiosk, guests and Lovelace
options:
  music_assistant_url: "http://192.168.0.18:8095"
  music_assistant_token: ""
  queue_id: ""
  ai_engine: ha_task
  ai_task_entity: ""
  openai_base_url: "https://openrouter.ai/api/v1"
  openai_model: ""
  openai_api_key: ""
  api_token: ""
schema:
  music_assistant_url: str
  music_assistant_token: password
  queue_id: str
  ai_engine: list(ha_task|openai_compatible)
  ai_task_entity: str
  openai_base_url: str
  openai_model: str
  openai_api_key: password
  api_token: password
