<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Party · Musikønsker</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}:root{font-family:system-ui,-apple-system,sans-serif;color:#24292e;background:#f5f5f5;color-scheme:light}body{margin:0}.top{height:64px;border-bottom:1px solid #d5d8da;display:flex;align-items:center;justify-content:center;background:#fafafa}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:650}.logo{color:#00a9e8;font-size:27px}main{max-width:1152px;margin:26px auto;padding:0 18px}.intro{color:#62696e;margin:0 0 20px;line-height:1.5}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,input{font:inherit}button{border:1px solid #cbd1d5;background:#fff;color:#34414a;border-radius:22px;padding:9px 18px;cursor:pointer}button.active{background:#d0ebf7;color:#006f9a;border-color:#00a9e8}button:disabled{opacity:.5;cursor:wait}.accent{background:#009fdb;color:white;border-color:#009fdb}.help{font-size:14px;color:#5d686f;min-height:21px;margin:8px 0 13px}form{display:flex;gap:8px;align-items:center}input[type=search]{flex:1;min-width:0;width:100%;height:44px;padding:0 14px;border:1px solid #ced3d7;box-shadow:0 1px 3px #0000000d;border-radius:8px;background:#fafafa;color:#24292e}#similar-current{margin-top:12px;border-radius:8px;text-align:left}#status{color:#58646b;font-size:14px;min-height:22px}.heading{display:flex;gap:14px;align-items:center;color:#7c858a;font-size:14px;text-transform:uppercase;letter-spacing:1px;margin:22px 0 12px}.heading:after{content:'';height:1px;background:#d7dadd;flex:1}.track,.queue-row{display:flex;align-items:center;gap:15px;padding:12px 16px;background:#ebebeb;border-radius:12px;margin:8px 0;min-height:72px}.queue-row.current{background:#d0ebf7;border-left:5px solid #00a9e8;padding-left:11px}.art{width:48px;height:48px;object-fit:cover;border-radius:7px;flex-shrink:0;background:#d6dce0;display:grid;place-items:center;color:#71828c;font-size:24px}.row-meta{flex:1;min-width:0}.row-similar{margin-left:auto;flex-shrink:0;width:42px;height:42px;padding:0;font-size:25px;border-radius:50%;background:#f7fafb;color:#0088bb}.track strong,.queue-row strong{display:block;font-size:15px}.track small,.queue-row small{display:block;color:#707a81;font-size:13px;margin-top:3px}.track input{width:19px;height:19px;flex-shrink:0;accent-color:#009fdb}.number{color:#889299;width:15px;text-align:center;font-size:13px}.bottom{position:sticky;bottom:12px;background:#f5f5f5ed;padding:12px;border:1px solid #d3d8dc;border-radius:12px;margin:15px 0;backdrop-filter:blur(6px)}.bottom button{width:100%;border-radius:8px}.policy{font-size:13px;color:#758087;line-height:1.5;margin:18px 0}.empty{color:#7b858c;font-size:14px}@media(max-width:600px){main{margin:20px auto;padding:0 14px}.top{height:58px}.tabs button{flex:1;padding:9px 12px;font-size:14px}.track,.queue-row{gap:10px;padding:11px}.number{width:12px}.row-meta{flex:1;min-width:0}.row-similar{margin-left:auto;flex-shrink:0;width:42px;height:42px;padding:0;font-size:25px;border-radius:50%;background:#f7fafb;color:#0088bb}.track strong,.queue-row strong{font-size:14px}.art{width:42px;height:42px}form button{padding:10px 17px}.intro{font-size:14px}}
.playing-icon{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:18px;flex-shrink:0;color:#00a9e8}.playing-icon i{display:block;width:3px;height:15px;background:currentColor;animation:music-bars .85s ease-in-out infinite alternate}.playing-icon i:nth-child(2){animation-delay:-.4s}.playing-icon i:nth-child(3){animation-delay:-.65s}.playing-icon.paused i{animation:none;height:8px}@keyframes music-bars{from{height:4px}to{height:16px}}@media(prefers-reduced-motion:reduce){.playing-icon i{animation-name:music-bars-gentle;animation-duration:2s}}@keyframes music-bars-gentle{from{height:8px}to{height:13px}}.similar-legend{font-size:13px;color:#5d686f;line-height:1.5;margin:16px 0}.similar-legend strong{color:#0088bb;font-size:21px;margin-right:6px}
</style></head><body><header class="top"><div class="brand"><span class="logo" aria-hidden="true">♫</span>Party · Musikønsker</div></header><main>
<p class="intro">Vælg musik til festen. Se hvad der spiller, og læg dit næste ønske i køen.</p>
<nav class="tabs" aria-label="Søgemåde"><button hidden data-mode="library">Søg</button><button hidden data-mode="similar">Samme stil</button><button hidden data-mode="ai">AI</button></nav>
<p id="help" class="help"></p><form hidden><input id="query" type="search" maxlength="1000" autocomplete="off" aria-label="Musikønske"><button id="search" class="accent">Søg</button></form>
<p id="similar-legend" class="similar-legend" hidden><strong aria-hidden="true">≈</strong> Find lignende: tryk på ≈ ved et nummer for at få musikforslag, der ligner netop dét nummer. Du vælger selv, hvad der tilføjes til køen.</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="result-section" hidden><h2 class="heading">Søgeresultater</h2><div id="results"></div><div id="add-bar" class="bottom" hidden><button id="add" class="accent">Tilføj valgte numre</button></div></section>
<h2 class="heading">Afspilningskø</h2><section id="queue" aria-label="Afspilningskø"><p class="empty">Henter musikken…</p></section><p id="queue-help" class="policy"></p>
</main><script>
const standalone=true;
const $=id=>document.getElementById(id),tabs=[...document.querySelectorAll('[data-mode]')];
const linkedToken=new URLSearchParams(location.hash.slice(1)).get('token');let token=linkedToken||sessionStorage.getItem('party-guest-token')||'';
if(token){sessionStorage.setItem('party-guest-token',token);history.replaceState(null,'',location.pathname);}
let modes={},mode='library',job=null,epoch=0,busy=false,configBusy=false,disposed=false;
async function api(path,data){const r=await fetch('/api/guest/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'Forbindelsen mislykkedes');return v;}
function changeMode(value){mode=value;epoch++;busy=false;$('search').disabled=false;job=null;$('results').replaceChildren();$('result-section').hidden=true;$('add-bar').hidden=true;$('status').textContent='';tabs.forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));$('help').textContent=mode==='ai'?'Beskriv stemningen eller anledningen. AI foreslår musik, der passer til dit ønske.':mode==='similar'?'Beskriv den stil eller lyd, du kan lide, eller find musik, der ligner det, der spiller.':'Find et nummer eller en kunstner i MA-biblioteket og de tilsluttede musikkilder. Denne søgning bruger ikke AI.';$('query').placeholder=mode==='ai'?'Fx rolig jazz med saxofon':mode==='similar'?'Fx blød jazz med varm sangstemme':'Titel eller kunstner';$('search').textContent=mode==='ai'?'Spørg AI':mode==='similar'?'Find lignende':'Søg';}
function art(track){const path=track.image||(track.metadata?.images||[]).find(i=>/^https?:\/\//.test(i.path||''))?.path;const el=document.createElement(path?'img':'span');el.className='art';if(path){el.src=path;el.alt='';el.loading='lazy';el.onerror=()=>{el.removeAttribute('src');};}else{el.textContent='♫';el.setAttribute('aria-hidden','true');}return el;}
function similarButton(name, reference){const b=document.createElement('button');b.type='button';b.className='row-similar';b.textContent='≈';b.title=b.ariaLabel='Find lignende '+name;b.onclick=e=>{e.preventDefault();e.stopPropagation();search('track_similar',reference);};return b;}
function queueView(items,playing){$('queue').replaceChildren();if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='Der står endnu ingen numre i køen.';$('queue').append(p);return;}for(const [i,t]of items.entries()){const row=document.createElement('div');row.className='queue-row'+(t.current?' current':'');const n=document.createElement('span');n.className='number';if(t.current){n.classList.add('playing-icon');if(!playing)n.classList.add('paused');n.setAttribute('role','img');n.ariaLabel=playing?'Spiller nu':'Afspilning pauset';for(let j=0;j<3;j++)n.append(document.createElement('i'));}else n.textContent=i+1;const meta=document.createElement('div'),title=document.createElement('strong'),artist=document.createElement('small');title.textContent=t.name;artist.textContent=(t.artists||[]).map(a=>a.name).join(', ')+(t.current?(playing?' · Spiller nu':' · Pauset'):'');meta.className='row-meta';meta.append(title,artist);row.append(n,art(t),meta);if(modes.current_similar&&t.id)row.append(similarButton(t.name,{queue_item_id:t.id}));$('queue').append(row);}}
async function refresh(){if(configBusy||disposed)return;configBusy=true;try{const c=await api('config');if(disposed)return;const oldTrackMode=modes.current_similar;modes=c.modes;$('similar-legend').hidden=!modes.current_similar;if(job&&oldTrackMode!==modes.current_similar){$('results').querySelectorAll('.row-similar').forEach(b=>b.remove());if(modes.current_similar)[...$('results').querySelectorAll('.track')].forEach((row,i)=>row.append(similarButton(job.tracks[i].name,{id:job.id,index:i})));}tabs.forEach(t=>t.hidden=!modes[t.dataset.mode]);if(!modes[mode])changeMode(tabs.find(t=>!t.hidden)?.dataset.mode||'library');const enabled=tabs.some(t=>!t.hidden);document.querySelector('form').hidden=!enabled;$('help').hidden=!enabled;if(!enabled)$('status').textContent='Søgning med tekst er slået fra af værten.';queueView(c.queue||[],c.playing);$('queue-help').textContent=(c.queue_help||'Dit musikønske tilføjes sidst i køen.')+(c.continuous?' Musikken fortsætter automatisk, når køen bliver kort.':'');}catch(e){$('status').textContent=e.message;}finally{configBusy=false;}}
function render(v){job=v;$('results').replaceChildren();$('result-section').hidden=false;for(const [i,t]of v.tracks.entries()){const row=document.createElement('label');row.className='track';const check=document.createElement('input');check.type='checkbox';check.value=i;check.checked=!v.added.includes(i);check.disabled=v.added.includes(i);const text=document.createElement('div'),title=document.createElement('strong'),artist=document.createElement('small');title.textContent=t.name;artist.textContent=(t.artists||[]).map(a=>a.name).join(', ')+(check.disabled?' · Tilføjet':'');text.className='row-meta';text.append(title,artist);row.append(check,art(t),text);if(modes.current_similar)row.append(similarButton(t.name,{id:v.id,index:i}));$('results').append(row);}$('add-bar').hidden=!v.tracks.some((_,i)=>!v.added.includes(i));$('status').textContent=v.tracks.length?'Vælg dine musikønsker.':'Ingen numre fundet. Prøv et andet ønske.';}
async function search(selected,reference={}){if(busy)return;const query=$('query').value.trim();if(!['current_similar','track_similar'].includes(selected)&&!query)return;const run=++epoch;busy=true;$('search').disabled=true;$('results').replaceChildren();$('add-bar').hidden=true;$('status').textContent=selected==='ai'?'AI finder musik…':'Søger…';try{const created=await api('search',{mode:selected,query,...reference});const started=Date.now();let immediate=created.state==='ready'?created:null;for(;;){if(run!==epoch||disposed)return;const v=immediate||await api('jobs/'+created.id);immediate=null;if(run!==epoch||disposed)return;if(v.state==='error')throw Error(v.error);if(v.state==='ready'){render(v);$('result-section').scrollIntoView({block:'start',behavior:'smooth'});break;}if(Date.now()-started>180000)throw Error('Søgningen tog for lang tid. Prøv igen.');$('status').textContent=v.progress||'Finder forslag…';await new Promise(r=>setTimeout(r,1200));}}catch(e){if(run===epoch)$('status').textContent=e.message;}finally{if(run===epoch){busy=false;$('search').disabled=false;}}}
tabs.forEach(t=>t.onclick=()=>changeMode(t.dataset.mode));document.querySelector('form').onsubmit=e=>{e.preventDefault();search(mode);};
$('add').onclick=async()=>{if(!job)return;const activeJob=job,run=epoch;const selected=[...$('results').querySelectorAll('input:checked:not(:disabled)')].map(i=>Number(i.value));if(!selected.length)return;$('add').disabled=true;try{const result=await api('queue',{id:activeJob.id,indices:selected});const updated=await api('jobs/'+activeJob.id);if(run===epoch){render(updated);$('status').textContent=result.queued+' numre tilføjet til køen';}refresh();}catch(e){if(run===epoch)$('status').textContent=e.message;}finally{$('add').disabled=false;}};
async function boot(){if(!linkedToken&&standalone){try{const joined=await api('join');token=new URLSearchParams(joined.path.split('#')[1]).get('token')||'';sessionStorage.setItem('party-guest-token',token);}catch(e){$('status').textContent=e.message;return;}}await refresh();}
changeMode('library');boot();const timer=setInterval(refresh,5000);addEventListener('pagehide',()=>{disposed=true;epoch++;clearInterval(timer);});
</script></body></html>
