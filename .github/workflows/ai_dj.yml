name: Test and build Party AI DJ
on:
  push:
    branches: [main]
    paths: ["ai_dj/**", ".github/workflows/ai_dj.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai_dj/requirements.txt
      - run: python -m unittest discover -s ai_dj/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check guest page in a mobile browser
        run: |
          npm install --prefix /tmp/party-web playwright@1.55.1
          /tmp/party-web/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/party-web/node_modules node ai_dj/tests/guest_ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: party-guest-preview
          path: dist/qa/guest-page-preview.png
      - name: Build container
        run: |
          VERSION=$(python -c 'import re; print(re.search(r"version: \"([^\"]+)\"", open("ai_dj/config.yaml").read()).group(1))')
          docker build --build-arg BUILD_VERSION="$VERSION" --build-arg BUILD_ARCH=amd64 -t party-ai-dj:test ai_dj
      - name: Verify startup
        run: |
          mkdir /tmp/dj-options
          printf '%s\n' '{}' > /tmp/dj-options/options.json
          docker run -d --name dj-test -p 18101:8101 -v /tmp/dj-options:/data:ro party-ai-dj:test
          trap 'docker logs dj-test; docker rm -f dj-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18101/health; then exit 0; fi
            sleep 1
          done
          exit 1
