name: Build and release Party Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: party-mode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-35" >/dev/null
      - name: Build plugin
        run: python3 tools/build.py --android-platform 35
      - name: Verify queue, guest access, QR, audio signals and visibility
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/party-json.jar
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar -o /tmp/qr-decoder.jar
          mkdir -p /tmp/party-test
          javac --release 8 -cp /tmp/qr-decoder.jar:/tmp/party-json.jar -d /tmp/party-test src/io/nayuki/qrcodegen/*.java src/me/jxl/kiosk/plugins/partymode/PartyGuestLink.java src/me/jxl/kiosk/plugins/partymode/PartySignal.java src/me/jxl/kiosk/plugins/partymode/PartyGuestConfig.java src/me/jxl/kiosk/plugins/partymode/PartyQueueModel.java src/me/jxl/kiosk/plugins/partymode/PartyActivation.java src/me/jxl/kiosk/plugins/partymode/PartyVisibility.java src/me/jxl/kiosk/plugins/partymode/PartyPlayerControls.java src/me/jxl/kiosk/plugins/partymode/PartyJukebox.java src/me/jxl/kiosk/plugins/partymode/PartyEq.java src/me/jxl/kiosk/plugins/partymode/PartyLyrics.java src/me/jxl/kiosk/plugins/partymode/PartyPlacement.java src/me/jxl/kiosk/plugins/partymode/PartyMotion.java tests/*.java
          for TEST in PartyQueueModelTest PartyGuestLinkTest PartyGuestConfigTest PartySignalTest PartyQrTest PartyActivationTest PartyPlayerControlsTest PartyJukeboxTest PartyEqTest PartyFeaturesTest; do
            java -cp /tmp/party-test:/tmp/party-json.jar:/tmp/qr-decoder.jar "me.jxl.kiosk.plugins.partymode.$TEST"
          done
      - name: Validate preset with official Music Assistant DSP models
        run: |
          python3 -m pip install --quiet mashumaro==3.16
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/music-assistant/models/8a7221066c7dc4c1d1cbc1c2b4dea357d40f36e4/music_assistant_models/dsp.py -o /tmp/ma_dsp_models.py
          python3 tests/validate_dsp.py
      - name: Verify release ZIP with Kiosk Satellite installer
        run: |
          curl --fail --silent --show-error --location https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin-compiler.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/party-kotlin
          KIOSK_REF=382621d4722d3bf9b7de83ec70750df443d7d528
          KIOSK_SRC="https://raw.githubusercontent.com/jxlarrea/kiosk-satellite/$KIOSK_REF/app/android/app/src/main/kotlin/me/jxl/kiosk_satellite/plugins"
          curl --fail --silent --show-error --location "$KIOSK_SRC/PluginPackage.kt" -o /tmp/PluginPackage.kt
          curl --fail --silent --show-error --location "$KIOSK_SRC/PluginManifest.kt" -o /tmp/PluginManifest.kt
          /tmp/party-kotlin/kotlinc/bin/kotlinc /tmp/PluginPackage.kt /tmp/PluginManifest.kt tests/PluginInstallTest.kt -cp /tmp/party-json.jar -include-runtime -d /tmp/party-installer-test.jar
          VERSION=$(python3 -c 'import json; print(json.load(open("kiosk-satellite-plugin.json"))["version"])')
          java -cp /tmp/party-installer-test.jar:/tmp/party-json.jar PluginInstallTestKt "dist/party-mode-$VERSION.zip" kiosk-satellite-plugin.json tests/fixtures/party-mode-0.1.3.json
      - name: Build native UI smoke-test app
        run: |
          python3 -m pip install --quiet pillow==11.3.0
          python3 tests/android/build_qa.py
          sudo chmod 666 /dev/kvm
      - name: Render and smoke-test native Android panels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: python3 tests/android/run_qa.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-mode
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/qa/*.png
      - name: Create GitHub release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("kiosk-satellite-plugin.json"))["version"])')
          TAG="v$VERSION"
          CURRENT_HEAD=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "A newer commit supersedes this build; release skipped."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" "dist/party-mode-$VERSION.zip" "dist/party-mode-$VERSION.zip.sha256" kiosk-satellite-plugin.json --target "$GITHUB_SHA" --title "Party Mode $VERSION" --notes-file RELEASE_NOTES.md
