name: Build and release Party Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-35" >/dev/null
      - name: Build plugin
        run: python3 tools/build.py --android-platform 35
      - name: Verify queue, guest access, QR, audio signals and visibility
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/party-json.jar
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar -o /tmp/qr-decoder.jar
          mkdir -p /tmp/party-test
          javac --release 8 -cp /tmp/qr-decoder.jar:/tmp/party-json.jar -d /tmp/party-test src/io/nayuki/qrcodegen/*.java src/me/jxl/kiosk/plugins/partymode/PartyGuestLink.java src/me/jxl/kiosk/plugins/partymode/PartySignal.java src/me/jxl/kiosk/plugins/partymode/PartyGuestConfig.java src/me/jxl/kiosk/plugins/partymode/PartyQueueModel.java src/me/jxl/kiosk/plugins/partymode/PartyActivation.java src/me/jxl/kiosk/plugins/partymode/PartyVisibility.java tests/*.java
          for TEST in PartyQueueModelTest PartyGuestLinkTest PartyGuestConfigTest PartySignalTest PartyQrTest PartyActivationTest; do
            java -cp /tmp/party-test:/tmp/party-json.jar:/tmp/qr-decoder.jar "me.jxl.kiosk.plugins.partymode.$TEST"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-mode
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Create GitHub release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("kiosk-satellite-plugin.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" "dist/party-mode-$VERSION.zip" "dist/party-mode-$VERSION.zip.sha256" kiosk-satellite-plugin.json --target "$GITHUB_SHA" --title "Party Mode $VERSION" --notes-file RELEASE_NOTES.md
