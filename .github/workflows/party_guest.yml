name: Test and build independent Party Guest
on:
  push:
    branches: [main]
    paths: ["party_guest/**", "ai_dj/guests.py", "ai_dj/guest.html", ".github/workflows/party_guest.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r party_guest/requirements.txt
      - run: python -m unittest discover -s party_guest/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check standalone guest URL and ingress without AI DJ
        run: |
          npm install --prefix /tmp/party-web playwright@1.55.1
          /tmp/party-web/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/party-web/node_modules node party_guest/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-party-guest-preview
          path: dist/qa/party-guest-*.png
      - name: Build standalone container
        run: docker build --build-arg BUILD_VERSION=0.2.3 --build-arg BUILD_ARCH=amd64 -t party-guest:test party_guest
      - name: Verify startup without any AI configuration
        run: |
          mkdir /tmp/guest-options
          printf '%s\n' '{}' > /tmp/guest-options/options.json
          docker run -d --name guest-test -p 18102:8102 -v /tmp/guest-options:/data:ro party-guest:test
          trap 'docker logs guest-test; docker rm -f guest-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18102/health; then
              curl --fail --silent http://127.0.0.1:18102/guest/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
