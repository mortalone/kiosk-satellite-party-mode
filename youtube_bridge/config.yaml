name: YouTube Bridge for Music Assistant
version: "0.1.3"
slug: youtube_bridge
description: Search ordinary YouTube in official Music Assistant through OpenSubsonic
url: https://github.com/mortalone/kiosk-satellite-party-mode/tree/main/youtube_bridge
arch: [amd64, aarch64]
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:youtube
ports:
  8102/tcp: 8102
ports_description:
  8102/tcp: Authenticated OpenSubsonic source for Music Assistant
options:
  username: youtube
  password: ""
  search_limit: 10
  cache_mb: 512
  max_track_minutes: 120
  lyrics_enabled: true
  allow_auto_lyrics: false
  prefetch_enabled: true
  prefetch_tracks: 2
  music_assistant_url: ""
  music_assistant_token: ""
schema:
  username: str
  password: password
  search_limit: int(1,30)
  cache_mb: int(128,8192)
  max_track_minutes: int(1,240)
  lyrics_enabled: bool
  allow_auto_lyrics: bool
  prefetch_enabled: bool
  prefetch_tracks: int(1,5)
  music_assistant_url: str
  music_assistant_token: password
